<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-labelledby="rf-title" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="rf-title">Rida Ahmed. AI Engineering, Machine Learning and Data Science.</title>

  <defs>
    <linearGradient id="rf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.6" stop-color="#2A0C18"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="rf-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rf-pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F0F3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F8F0F3" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F8F0F3" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rf-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="rf-glow" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="4" result="rf-blur"/>
      <feMerge>
        <feMergeNode in="rf-blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="rf-frame"><rect width="1200" height="140" rx="14"/></clipPath>
    <clipPath id="rf-track"><rect x="200" y="60" width="800" height="4"/></clipPath>
  </defs>

  <style>
    .rf-text { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace; font-size: 14px; letter-spacing: 5px; fill: #E9B5C8; }
    .rf-sub  { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; font-style: italic; fill: #F8F0F3; }
    .rf-pulse { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .rf-pulse { opacity: 1; animation: rf-travel 6s ease-in-out infinite; }
    }
    @keyframes rf-travel { 0% { transform: translateX(-220px); } 100% { transform: translateX(820px); } }
  </style>

  <g clip-path="url(#rf-frame)">
    <rect width="1200" height="140" fill="url(#rf-bg)"/>
    <rect width="1200" height="140" fill="url(#rf-grid)"/>

    <rect x="200" y="60" width="800" height="2" fill="url(#rf-line)" filter="url(#rf-glow)"/>
    <g clip-path="url(#rf-track)">
      <rect class="rf-pulse" x="200" y="59" width="200" height="4" rx="2" fill="url(#rf-pulse)"/>
    </g>
    <circle cx="600" cy="61" r="4" fill="#F8F0F3"/>
    <circle cx="600" cy="61" r="10" fill="none" stroke="#C77B9B" stroke-opacity="0.5"/>

    <text class="rf-sub" x="600" y="38" text-anchor="middle">Thanks for stopping by.</text>
    <text class="rf-text" x="600" y="104" text-anchor="middle">RIDA AHMED &#160;·&#160; AI &#160;·&#160; ML &#160;·&#160; DATA</text>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="138.5" rx="14" fill="none" stroke="#C77B9B" stroke-opacity="0.3" stroke-width="1.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
